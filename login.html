<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - Colegio Integral San Miguel</title>
    <style>
        :root {
            --azul-oscuro: #2f4f5f;
            --azul-medio: #4d657c;
            --verde: #77cdba;
            --gris: #56646a;
            --blanco: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
                url("img/fondo.png") center/cover no-repeat;
            color: #333;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--azul-oscuro), var(--gris));
            color: var(--blanco);
            text-align: center;
            padding: 28px 20px 20px;
        }

        .login-header img {
            width: 90px;
            margin-bottom: 10px;
        }

        .login-header h1 {
            font-size: 1.2rem;
            margin: 0 0 6px;
        }

        .login-header p {
            margin: 0;
            font-size: 0.95rem;
            opacity: 0.95;
        }

        .login-form {
            padding: 25px 28px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .login-form h2 {
            margin: 0 0 8px;
            color: var(--azul-medio);
            text-align: center;
            font-size: 1.35rem;
        }

        .login-form label {
            font-weight: bold;
            color: var(--azul-oscuro);
            font-size: 0.95rem;
        }

        .login-form input {
            padding: 12px 14px;
            border: 1px solid #d8d8d8;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .login-form input:focus {
            border-color: var(--verde);
            box-shadow: 0 0 0 3px rgba(119, 205, 186, 0.2);
        }

        .login-form button {
            margin-top: 8px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--verde), var(--azul-medio));
            color: var(--blanco);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .login-form button:hover {
            transform: translateY(-2px);
        }

        .login-links {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.9rem;
        }

        .login-links a {
            text-decoration: none;
            color: var(--azul-medio);
        }

        .login-links a:hover {
            color: var(--azul-oscuro);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-form {
                padding: 20px;
            }

            .login-header {
                padding: 24px 16px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="img/logo.png" alt="Logo del Colegio">
            <h1>Colegio Integral San Miguel</h1>
            <p>Plataforma educativa</p>
        </div>

        <form class="login-form">
            <h2>Iniciar sesión</h2>

            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" placeholder="Ingrese su usuario" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingrese su contraseña" required>

            <button type="submit">Ingresar</button>

            <div class="login-links">
                <a href="index.html">Volver al inicio</a>
                <a href="#">Olvidé mi contraseña</a>
            </div>
        </form>
    </div>
    <script src="js/iniciosesison.js"></script>
</body>
</html>
